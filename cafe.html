<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 기기에 꽉 차게 렌더링되도록 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아롱다롱카페</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Apple SD Gothic Neo', sans-serif; text-align: center; background-color: #fefcfb; 
            margin: 0; padding: 20px 15px; min-height: 100vh; display: flex; flex-direction: column;
        }
        h1 { color: #5d4037; font-size: 1.8rem; margin: 10px 0 20px 0; }
        
        /* 모바일 반응형 메뉴판 */
        .menu-container { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%;
        }
        .menu-item { 
            flex: 1 1 calc(33.333% - 10px); min-width: 90px;
            padding: 15px 5px; background: white; border: 2px solid #d7ccc8; border-radius: 12px;
            cursor: pointer; font-size: 0.95rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.1s, background-color 0.1s; color: #4e342e; line-height: 1.4;
        }
        /* 모바일 터치 효과 */
        .menu-item:active { transform: scale(0.95); background: #efebe9; }
        .price { font-size: 0.8rem; color: #795548; font-weight: normal; }

        /* 컵 및 애니메이션 영역 (화면 중앙에 꽉 차게) */
        #cafe-area { 
            position: relative; flex-grow: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; margin: 30px 0;
        }
        .cup { 
            width: 150px; height: 200px; border: 6px solid #5d4037; border-top: none;
            border-radius: 0 0 60px 60px; position: relative; overflow: hidden; background: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .liquid { 
            position: absolute; bottom: 0; width: 100%; height: 0%; 
            transition: height 0.5s ease-in-out; /* 액체가 차오르는 시간 0.5초 */
        }
        
        /* 라떼아트(꿀그림) & 액세서리 */
        .art-layer { 
            position: absolute; top: 15%; width: 100%; text-align: center; 
            font-size: 55px; opacity: 0; transition: opacity 0.5s; color: #FFD700;
            text-shadow: 1px 1px 3px rgba(184, 134, 11, 0.5);
        }
        .accessory { position: absolute; top: -15px; right: 25px; font-size: 25px; }

        /* 결과 모달 (모바일 화면 덮기) */
        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 100;
        }
        .modal-content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px 20px; border-radius: 20px; 
            width: 85%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-content h2 { margin: 0 0 10px 0; color: #5d4037; font-size: 1.5rem; word-break: keep-all; }
        .beverage-name { 
            display: inline-block; padding: 5px 15px; border-radius: 20px; 
            font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #fff;
        }
        
        button#reset-btn { 
            width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; 
            border-radius: 12px; border: none; background: #5d4037; color: white; margin-top: 15px;
        }

        /* 하단 정보 고정 */
        #total-money { 
            position: fixed; bottom: 20px; right: 20px; font-weight: bold; font-size: 1.1rem; 
            background: rgba(255, 255, 255, 0.95); padding: 12px 20px; border-radius: 30px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: 2px solid #d7ccc8; color: #4e342e; z-index: 50;
        }
    </style>
</head>
<body>

    <h1>☕ 아롱다롱카페</h1>

    <div class="menu-container">
        <!-- 터치 시 색상, 이름, 가격 전달 -->
        <div class="menu-item" onclick="order('카페라떼', 1000, '#D2B48C', '#8D6E63')">
            카페라떼<br><span class="price">1,000원</span>
        </div>
        <div class="menu-item" onclick="order('레몬에이드', 1500, '#FFFACD', '#FBC02D')">
            레몬에이드<br><span class="price">1,500원</span>
        </div>
        <div class="menu-item" onclick="order('녹차라떼', 2000, '#98FB98', '#66BB6A')">
            녹차라떼<br><span class="price">2,000원</span>
        </div>
    </div>

    <div id="cafe-area">
        <div class="cup">
            <div id="liquid" class="liquid"></div>
            <div id="art-layer" class="art-layer">
                <span id="art-icon"></span>
                <span id="acc-icon" class="accessory"></span>
            </div>
        </div>
    </div>

    <div id="total-money">번 돈: <span id="money">0</span>원</div>

    <!-- 완성 모달 오버레이 -->
    <div id="modal-overlay">
        <div class="modal-content">
            <div id="bev-badge" class="beverage-name"></div>
            <h2>완성되었어요!</h2>
            <div id="final-display" style="font-size: 60px; margin: 20px 0; position: relative;"></div>
            <button id="reset-btn" onclick="resetCafe()">완료</button>
        </div>
    </div>

    <script>
        let totalMoney = 0;
        let isMaking = false; // 음료 제작 중 중복 터치 방지
        const arts = ['🐶', '🐱', '❤️', '🐰'];
        const accessories = ['🌺', '🌟', '🕶️', '💎']; // 꽃머리핀, 별, 안경, 귀걸이(보석)

        function order(name, price, liquidColor, badgeColor) {
            if (isMaking) return; // 이미 만들고 있다면 무시
            isMaking = true;
            
            const liquid = document.getElementById('liquid');
            const artLayer = document.getElementById('art-layer');
            const artIcon = document.getElementById('art-icon');
            const accIcon = document.getElementById('acc-icon');
            
            // 1. 돈 추가
            totalMoney += price;
            document.getElementById('money').innerText = totalMoney.toLocaleString();

            // 2. 음료 채우기 (0.5초 애니메이션)
            liquid.style.backgroundColor = liquidColor;
            liquid.style.height = '90%';

            // 3. 차오른 후(0.5초) + 딜레이(0.5초) = 총 1초 뒤에 꿀그림 등장
            setTimeout(() => {
                const randomArt = arts[Math.floor(Math.random() * arts.length)];
                const randomAcc = accessories[Math.floor(Math.random() * accessories.length)];
                
                artIcon.innerText = randomArt;
                accIcon.innerText = randomAcc;
                artLayer.style.opacity = '1';

                // 4. 꿀그림 등장 후 0.5초 딜레이 뒤 모달 창 띄우기
                setTimeout(() => {
                    showModal(name, randomArt, randomAcc, badgeColor);
                }, 500);
                
            }, 1000); 
        }

        function showModal(name, art, acc, badgeColor) {
            const overlay = document.getElementById('modal-overlay');
            const badge = document.getElementById('bev-badge');
            const display = document.getElementById('final-display');
            
            // 모달에 음료 이름과 테마 색상 적용
            badge.innerText = name;
            badge.style.backgroundColor = badgeColor;
            
            // 완성된 아트 표시
            display.innerHTML = `${art}<span style="position:absolute; top:-10px; right:110px; font-size:30px;">${acc}</span>`;
            
            overlay.style.display = 'block';
        }

        function resetCafe() {
            // 초기화 후 새 음료를 받을 수 있게 세팅
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('liquid').style.height = '0%';
            document.getElementById('art-layer').style.opacity = '0';
            
            // 초기화 애니메이션이 끝난 후 클릭 잠금 해제
            setTimeout(() => {
                isMaking = false;
            }, 300);
        }
    </script>
</body>
</html>
