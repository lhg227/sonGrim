<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ADHD Visual Clock - Persistent</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f8f9fa; padding: 20px; }
        #clock-container { position: relative; width: 400px; height: 400px; background: white; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.1); touch-action: none; margin-bottom: 20px; }
        canvas { position: absolute; top: 0; left: 0; }
        .controls { text-align: center; margin-bottom: 20px; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border-radius: 6px; border: none; background: #333; color: white; transition: 0.2s; }
        button:hover { background: #555; }
        button.delete-btn { background: #ff4d4d; padding: 4px 8px; font-size: 12px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        table { border-collapse: collapse; width: 350px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: center; }
        th { background: #f1f1f1; font-size: 14px; }
        .color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>
<body>

    <div id="clock-container">
        <canvas id="clockCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <div id="preview-time" style="margin-bottom: 10px; font-weight: bold; color: #555; height: 20px;">
            시계를 드래그하여 알람을 설정하세요
        </div>
        <button id="addAlarmBtn">시침선 확정</button>
    </div>

    <table id="alarmTable">
        <thead>
            <tr>
                <th>색상</th>
                <th>설정 시간</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

<script>
    const canvas = document.getElementById('clockCanvas');
    const ctx = canvas.getContext('2d');
    const radius = canvas.width / 2;
    const addAlarmBtn = document.getElementById('addAlarmBtn');
    const alarmTableBody = document.querySelector('#alarmTable tbody');
    const previewText = document.getElementById('preview-time');

    // 알람 데이터 구조 (로컬스토리지 연동)
    let alarmSlots = [null, null, null, null];
    const alarmColors = ['orange', 'skyblue', 'green', 'red'];
    
    let isDragging = false;
    let tempAngle = null;

    ctx.translate(radius, radius);

    // 1. 로컬스토리지에서 데이터 불러오기
    function loadAlarms() {
        const saved = localStorage.getItem('adhd_clock_alarms');
        if (saved) {
            alarmSlots = JSON.parse(saved);
        }
        updateUI();
    }

    // 2. 로컬스토리지에 데이터 저장하기
    function saveAlarms() {
        localStorage.setItem('adhd_clock_alarms', JSON.stringify(alarmSlots));
    }

    function drawClock() {
        ctx.clearRect(-radius, -radius, canvas.width, canvas.height);
        
        // 배경 및 숫자 1~12
        ctx.beginPath();
        ctx.arc(0, 0, radius - 10, 0, 2 * Math.PI);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.font = "bold 22px Arial";
        ctx.fillStyle = "#333";
        ctx.textBaseline = "middle";
        ctx.textAlign = "center";
        for (let num = 1; num <= 12; num++) {
            let ang = num * Math.PI / 6;
            ctx.rotate(ang);
            ctx.translate(0, -radius + 35);
            ctx.rotate(-ang);
            ctx.fillText(num.toString(), 0, 0);
            ctx.rotate(ang);
            ctx.translate(0, radius - 35);
            ctx.rotate(-ang);
        }

        // 저장된 알람선
        alarmSlots.forEach((alarm, index) => {
            if (alarm) drawHand(alarm.angle, radius - 55, 3, alarmColors[index]);
        });

        // 드래그 중인 예비선
        if (tempAngle !== null) {
            const nextSlotIndex = alarmSlots.indexOf(null);
            if (nextSlotIndex !== -1) drawHand(tempAngle, radius - 45, 2, alarmColors[nextSlotIndex]);
        }

        // 현재 시간 (시, 분, 초)
        const now = new Date();
        const h = now.getHours() % 12;
        const m = now.getMinutes();
        const s = now.getSeconds();

        const hourAng = (h * Math.PI / 6) + (m * Math.PI / (6 * 60));
        const minAng = (m * Math.PI / 30);
        const secAng = (s * Math.PI / 30);

        drawHand(hourAng, radius * 0.5, 6, '#333');
        drawHand(minAng, radius * 0.75, 4, '#777');
        drawHand(secAng, radius * 0.85, 1, '#ff4d4d');
        
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, 2 * Math.PI);
        ctx.fillStyle = '#333';
        ctx.fill();
    }

    function drawHand(angle, length, width, color) {
        ctx.save();
        ctx.beginPath();
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.strokeStyle = color;
        ctx.rotate(angle);
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -length);
        ctx.stroke();
        ctx.restore();
    }

    function angleToTime(angle) {
        let normalized = (angle * (180 / Math.PI) + 360) % 360;
        let totalMinutes = Math.round((normalized / 360) * 720);
        if (totalMinutes === 0 || totalMinutes === 720) totalMinutes = 720;
        let hours = Math.floor(totalMinutes / 60);
        let mins = totalMinutes % 60;
        if (hours === 0) hours = 12;
        return {
            display: `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`,
            angle: (totalMinutes / 720) * 2 * Math.PI
        };
    }

    function handleMove(e) {
        if (!isDragging) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left - radius;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top - radius;
        tempAngle = Math.atan2(y, x) + Math.PI / 2;
        const timeObj = angleToTime(tempAngle);
        previewText.innerText = `설정 예정: ${timeObj.display}`;
        drawClock();
    }

    canvas.addEventListener('mousedown', () => { if(alarmSlots.includes(null)) isDragging = true; });
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('touchstart', (e) => { if(alarmSlots.includes(null)) isDragging = true; e.preventDefault(); }, {passive: false});
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', () => { isDragging = false; });

    addAlarmBtn.addEventListener('click', () => {
        const nextIndex = alarmSlots.indexOf(null);
        if (tempAngle === null || nextIndex === -1) return;
        const timeObj = angleToTime(tempAngle);
        alarmSlots[nextIndex] = { time: timeObj.display, angle: timeObj.angle };
        tempAngle = null;
        saveAlarms(); // 저장
        updateUI();
    });

    // 글로벌 스코프에서 호출 가능하도록 설정
    window.deleteAlarm = function(index) {
        alarmSlots[index] = null;
        saveAlarms(); // 저장
        updateUI();
    };

    function updateUI() {
        alarmTableBody.innerHTML = '';
        alarmSlots.forEach((alarm, index) => {
            if (alarm) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="color-dot" style="background:${alarmColors[index]}"></span></td>
                    <td>${alarm.time}</td>
                    <td><button class="delete-btn" onclick="deleteAlarm(${index})">삭제</button></td>
                `;
                alarmTableBody.appendChild(row);
            }
        });
        const isFull = !alarmSlots.includes(null);
        addAlarmBtn.disabled = isFull;
        previewText.innerText = isFull ? "알람이 가득 찼습니다" : "시계를 드래그하여 알람을 설정하세요";
        drawClock();
    }

    // 초기 실행
    loadAlarms();
    setInterval(drawClock, 1000);
</script>
</body>
</html>
