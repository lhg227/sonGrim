<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>소용돌이치는 밤 — Canvas Vector Art</title>
  <style>
    :root {
      background: #081538;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 15%, #1c4076 0%, #0b1d48 42%, #04091f 100%);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .frame {
      width: min(94vw, 1100px);
      aspect-ratio: 16 / 10;
      padding: 12px;
      border: 1px solid rgba(249, 205, 84, 0.5);
      background: #07122c;
      box-shadow:
        0 0 0 8px rgba(1, 7, 24, 0.7),
        0 30px 80px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0b2560;
    }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="nightCanvas" aria-label="소용돌이치는 별빛의 밤 풍경"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("nightCanvas");
    const ctx = canvas.getContext("2d");

    function fitCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      draw(rect.width, rect.height);
    }

    function path(points, fill, stroke = null, lineWidth = 1) {
      ctx.beginPath();
      points.forEach(([x, y], index) => {
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();

      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }

      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      }
    }

    function curvedStroke(points, color, width, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();

      points.forEach((p, i) => {
        const [x, y] = p;
        if (i === 0) ctx.moveTo(x, y);
        else if (i === 1) ctx.lineTo(x, y);
        else {
          const prev = points[i - 1];
          const midX = (prev[0] + x) / 2;
          const midY = (prev[1] + y) / 2;
          ctx.quadraticCurveTo(prev[0], prev[1], midX, midY);
        }
      });

      ctx.stroke();
      ctx.restore();
    }

    function star(x, y, r, color = "#ffd86a") {
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = r * 2;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ffe9a4";
      ctx.lineWidth = Math.max(1, r * 0.35);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x - r * 2.2, y);
      ctx.lineTo(x + r * 2.2, y);
      ctx.moveTo(x, y - r * 2.2);
      ctx.lineTo(x, y + r * 2.2);
      ctx.stroke();
      ctx.restore();
    }

    function swirl(cx, cy, maxR, turns, color, width, phase = 0) {
      const points = [];
      const steps = 110;

      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const angle = phase + t * Math.PI * 2 * turns;
        const r = 8 + maxR * t;
        const x = cx + Math.cos(angle) * r * (1.35 - t * 0.35);
        const y = cy + Math.sin(angle) * r * 0.56;
        points.push([x, y]);
      }

      curvedStroke(points, color, width, 0.9);
    }

    function draw(w, h) {
      ctx.clearRect(0, 0, w, h);

      const sx = w / 1000;
      const sy = h / 625;
      ctx.save();
      ctx.scale(sx, sy);

      // 밤하늘 바탕
      const sky = ctx.createLinearGradient(0, 0, 0, 625);
      sky.addColorStop(0, "#071a4f");
      sky.addColorStop(0.5, "#124486");
      sky.addColorStop(1, "#2b5f99");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1000, 625);

      // 붓터치 느낌의 하늘 띠
      const skyBands = [
        [[-40, 115], [105, 78], [245, 114], [375, 82], [515, 105], [680, 62], [820, 85], [1040, 40]],
        [[-35, 206], [135, 174], [270, 214], [440, 180], [610, 225], [760, 178], [1040, 208]],
        [[-20, 294], [125, 257], [285, 305], [450, 262], [610, 303], [805, 260], [1030, 293]]
      ];

      skyBands.forEach((line, i) => {
        curvedStroke(line, i === 1 ? "#2675b9" : "#1d5eab", 18 - i * 2, 0.65);
        curvedStroke(line.map(([x, y]) => [x, y + 10]), "#4c91c7", 5, 0.55);
      });

      // 달과 달 주변의 회오리
      ctx.save();
      ctx.shadowColor = "#ffd967";
      ctx.shadowBlur = 28;
      ctx.fillStyle = "#ffd65c";
      ctx.beginPath();
      ctx.arc(755, 128, 49, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      swirl(755, 128, 107, 1.25, "#f7c747", 9, 0.3);
      swirl(755, 128, 142, 1.15, "#5ba2cf", 9, 1.2);
      swirl(755, 128, 180, 0.93, "#2c75b8", 13, 2.3);

      // 왼쪽 중심 대형 소용돌이
      swirl(325, 215, 175, 1.46, "#eac354", 14, 0.9);
      swirl(325, 215, 210, 1.28, "#4e9bc9", 13, 2.7);
      swirl(325, 215, 245, 1.05, "#1c5fa9", 17, 1.55);

      // 별
      [
        [110, 88, 8], [204, 148, 6], [445, 73, 7], [580, 148, 6],
        [895, 78, 7], [917, 218, 5], [560, 270, 5], [147, 280, 5],
        [660, 51, 4], [402, 165, 4], [82, 195, 4]
      ].forEach(([x, y, r]) => star(x, y, r));

      // 먼 언덕
      path(
        [[0, 445], [0, 421], [95, 404], [190, 425], [280, 390], [375, 420],
         [493, 392], [610, 429], [735, 390], [850, 413], [1000, 378], [1000, 625], [0, 625]],
        "#173c63"
      );

      curvedStroke(
        [[0, 431], [110, 415], [210, 440], [328, 407], [470, 431], [620, 415], [770, 399], [1000, 390]],
        "#4c88b2", 7, 0.8
      );

      // 마을
      const houses = [
        [400, 438, 68, 58], [478, 424, 80, 73], [570, 448, 60, 49],
        [642, 430, 70, 67], [722, 447, 63, 50], [795, 428, 84, 70]
      ];

      houses.forEach(([x, y, hw, hh], index) => {
        path(
          [[x, y + hh], [x, y + 18], [x + hw / 2, y - 4], [x + hw, y + 18], [x + hw, y + hh]],
          index % 2 ? "#244f86" : "#1d467b",
          "#0d2c5a",
          2
        );

        path(
          [[x - 6, y + 19], [x + hw / 2, y - 14], [x + hw + 6, y + 19], [x + hw / 2, y + 9]],
          "#17355f",
          "#0a244a",
          2
        );

        ctx.fillStyle = "#ffd35d";
        for (let wy = y + 30; wy < y + hh - 8; wy += 18) {
          for (let wx = x + 12; wx < x + hw - 8; wx += 20) {
            ctx.fillRect(wx, wy, 7, 9);
          }
        }
      });

      // 교회 첨탑
      path(
        [[532, 446], [532, 369], [546, 326], [560, 369], [560, 446]],
        "#12386d",
        "#092652",
        2
      );
      path(
        [[540, 369], [546, 302], [552, 369]],
        "#0b2858"
      );
      ctx.fillStyle = "#f7ca51";
      ctx.fillRect(542, 389, 8, 14);

      // 전경 들판
      path(
        [[0, 490], [116, 469], [253, 500], [382, 475], [535, 508], [688, 478],
         [836, 506], [1000, 471], [1000, 625], [0, 625]],
        "#0a3150"
      );

      [
        [[0, 525], [125, 493], [273, 537], [420, 503], [580, 539], [755, 501], [1000, 532]],
        [[0, 562], [160, 527], [310, 570], [455, 533], [625, 574], [805, 530], [1000, 560]],
        [[0, 604], [132, 566], [282, 611], [448, 569], [628, 610], [810, 568], [1000, 595]]
      ].forEach((line, i) => {
        curvedStroke(line, i === 1 ? "#1e6d87" : "#15526f", 14, 0.9);
        curvedStroke(line.map(([x, y]) => [x, y + 7]), "#347e8f", 4, 0.9);
      });

      // 왼쪽 사이프러스 나무
      ctx.save();
      ctx.translate(150, 525);

      const cypressLayers = [
        [[0, 90], [-33, 42], [-12, 21], [-48, -18], [-18, -7], [-35, -68], [-5, -43], [-10, -138], [16, -77], [27, -145], [35, -61], [60, -87], [41, -15], [58, 20], [25, 45], [35, 90]],
        [[3, 83], [-18, 39], [-2, 12], [-28, -37], [-4, -21], [-5, -114], [13, -60], [24, -120], [24, -35], [46, -65], [27, 3], [45, 31], [20, 52]],
        [[7, 75], [-10, 30], [8, 1], [-12, -48], [12, -29], [12, -131], [28, -55], [35, -13], [18, 21], [35, 45], [15, 67]]
      ];

      cypressLayers.forEach((shape, i) => {
        path(shape, ["#082d42", "#0b4355", "#10566a"][i], "#061f35", 2);
      });

      curvedStroke([[5, 76], [-9, 30], [12, -3], [-1, -48], [16, -89], [19, -129]], "#23788a", 5, 0.7);
      curvedStroke([[18, 80], [32, 39], [14, 8], [35, -34], [25, -73]], "#1c6d81", 5, 0.75);
      ctx.restore();

      // 캔버스 질감용 얇은 붓자국
      for (let y = 12; y < 625; y += 18) {
        ctx.globalAlpha = 0.08;
        ctx.strokeStyle = "#d6edff";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.quadraticCurveTo(350, y - 8, 1000, y + 3);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    window.addEventListener("resize", fitCanvas);
    fitCanvas();
  </script>
</body>
</html>
