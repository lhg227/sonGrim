<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>작은 3D 마을 산책</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9d7e8;font-family:"Malgun Gothic",sans-serif}
canvas{display:block}
#ui{position:fixed;left:16px;top:16px;color:#24382f;background:#fff8e6dd;border:1px solid #667c68;padding:10px 13px;border-radius:8px;font-size:13px;line-height:1.65;box-shadow:0 3px 12px #0002;user-select:none}
#ui b{font-size:15px}.small{font-size:11px;color:#617065}
#touch{position:fixed;left:18px;bottom:18px;width:150px;height:150px;display:none;user-select:none;touch-action:none}
#touch button{position:absolute;width:48px;height:48px;border:0;border-radius:12px;background:#29483bd9;color:#fff;font-size:21px;box-shadow:0 3px 0 #163027}
#up{left:51px;top:0}#left{left:0;top:51px}#right{right:0;top:51px}#down{left:51px;bottom:0}
@media(pointer:coarse){#touch{display:block}}
</style>
</head>
<body>
<div id="ui"><b>작은 3D 마을 산책</b><br>WASD / 방향키 · 이동<br>F · 내 GLB 모델 불러오기<br><span class="small">GLB는 플레이어 앞에 비슷한 크기로 나타납니다.</span></div>
<input id="glbFile" type="file" accept=".glb,model/gltf-binary" style="display:none">
<div id="touch"><button id="up">▲</button><button id="left">◀</button><button id="right">▶</button><button id="down">▼</button></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb8d9eb);
scene.fog=new THREE.Fog(0xb8d9eb,45,105);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xfff4d6,0x55705a,2.2);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe5b5,3.2);sun.position.set(-18,28,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);

function mat(color){return new THREE.MeshStandardMaterial({color,roughness:.88});}
function box(w,h,d,color,x,y,z,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;scene.add(m);return m;}

// 땅과 길
box(90,.5,90,0x82a969,0,-.25,0,false);
box(8,.08,90,0xc7b789,0,.04,0,false);
box(90,.08,7,0xc7b789,0,.045,7,false);
for(let z=-40;z<42;z+=5) box(.14,.03,2.1,0xe8dcae,0,.1,z,false);

// 작은 집
const house=new THREE.Group();
const wall=box(10,5.4,8,0xf0d49b,-12,2.7,-7);house.add(wall);
const roof=new THREE.Mesh(new THREE.ConeGeometry(7.2,3.3,4),mat(0xa95645));roof.rotation.y=Math.PI/4;roof.position.set(-12,6.7,-7);roof.castShadow=true;roof.receiveShadow=true;scene.add(roof);house.add(roof);
box(2.1,3.3,.25,0x76503b,-12,1.65,-2.88);
box(2.1,1.65,.22,0x9ed0d8,-15.1,3.25,-2.86);
box(2.1,1.65,.22,0x9ed0d8,-8.9,3.25,-2.86);
box(1.1,2.6,1.1,0x7e5a49,-15.2,7.1,-7.8);

// 울타리
for(let x=-21;x<=-3;x+=2){box(.18,1.1,.18,0xd8c99b,x,.55,-13);box(.18,1.1,.18,0xd8c99b,x,.55,-1);}
for(let z=-13;z<=-1;z+=2){box(.18,1.1,.18,0xd8c99b,-21,.55,z);}
box(18,.14,.14,0xd8c99b,-12,.72,-13);box(18,.14,.14,0xd8c99b,-12,.72,-1);box(.14,.14,12,0xd8c99b,-21,.72,-7);

// 나무
function tree(x,z,s=1){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35*s,.48*s,3.2*s,7),mat(0x79543d));trunk.position.y=1.6*s;trunk.castShadow=true;g.add(trunk);for(const [dx,dy,dz,sc] of [[0,4,0,1.8],[-.9,3.7,.2,1.25],[.9,3.8,.1,1.3],[0,3.8,-.8,1.25]]){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(sc*s,1),mat(0x4f8050));crown.position.set(dx*s,dy*s,dz*s);crown.castShadow=true;g.add(crown);}g.position.set(x,0,z);scene.add(g);}
[[-27,-20,1.1],[-23,17,.9],[17,-20,1.15],[25,-5,.8],[20,20,1.05],[-29,30,.95],[31,29,1]].forEach(v=>tree(...v));

// 꽃/덤불
for(let i=0;i<26;i++){const a=i*2.4;const x=-16+Math.sin(a)*6+Math.sin(i)*2,z=-7+Math.cos(a*.8)*6;const bush=new THREE.Mesh(new THREE.SphereGeometry(.32+(i%3)*.08,7,5),mat(i%4===0?0xe4c35e:0x5c8f55));bush.position.set(x,.28,z);bush.castShadow=true;scene.add(bush);}

// 블록형 3인칭 캐릭터
const player=new THREE.Group();
function limb(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;player.add(m);return m;}
const torso=limb(1.35,1.75,.75,0x4e79a7,0,2.35,0);
const head=limb(1.05,1.05,1.0,0xf0c49b,0,3.75,0);
const hair=limb(1.09,.28,1.04,0x443b35,0,4.27,-.01);
const armL=limb(.42,1.55,.5,0xf0c49b,-.9,2.35,0),armR=limb(.42,1.55,.5,0xf0c49b,.9,2.35,0);
const legL=limb(.5,1.55,.6,0x35485b,-.38,.72,0),legR=limb(.5,1.55,.6,0x35485b,.38,.72,0);
player.position.set(7,0,13);scene.add(player);

// 사용자가 불러온 GLB 모델
const gltfLoader=new GLTFLoader();
const glbInput=document.getElementById('glbFile');
let importedModel=null;
let importedObstacles=[];

function removeImportedModel(){
  if(importedModel){
    scene.remove(importedModel);
    importedModel.traverse(o=>{
      if(o.geometry)o.geometry.dispose?.();
      if(o.material){
        const mats=Array.isArray(o.material)?o.material:[o.material];
        mats.forEach(m=>m.dispose?.());
      }
    });
    importedModel=null;
  }
  importedObstacles.forEach(o=>{const i=obstacles.indexOf(o);if(i>=0)obstacles.splice(i,1);});
  importedObstacles=[];
}

function placeImportedModel(model){
  removeImportedModel();
  importedModel=model;
  scene.add(model);

  // 원본 크기와 원점을 조사하고, 가장 긴 축이 플레이어 키(약 4.8)와 비슷하도록 자동 축소/확대
  model.updateMatrixWorld(true);
  let bounds=new THREE.Box3().setFromObject(model);
  const size=new THREE.Vector3();bounds.getSize(size);
  const longest=Math.max(size.x,size.y,size.z);
  if(!Number.isFinite(longest)||longest<=0){alert('이 GLB의 크기를 확인할 수 없습니다.');removeImportedModel();return;}
  const targetSize=4.4;
  model.scale.setScalar(targetSize/longest);
  model.updateMatrixWorld(true);

  // 모델의 바닥 중앙을 그룹 원점에 맞춤
  bounds.setFromObject(model);
  const center=new THREE.Vector3();bounds.getCenter(center);
  model.position.x-=center.x;
  model.position.z-=center.z;
  model.position.y-=bounds.min.y;
  model.updateMatrixWorld(true);

  // 플레이어가 바라보는 방향의 약 5m 앞에 배치
  const forward=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));
  const spawn=player.position.clone().addScaledVector(forward,5.2);
  model.position.x+=spawn.x;
  model.position.z+=spawn.z;
  model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});

  // 모델의 실제 바닥 크기에 맞춰 원형 충돌체를 긴 축 방향으로 여러 개 배치
  bounds.setFromObject(model);
  const bc=new THREE.Vector3(),bs=new THREE.Vector3();
  bounds.getCenter(bc);bounds.getSize(bs);
  const alongX=bs.x>=bs.z;
  const longLen=alongX?bs.x:bs.z, shortLen=Math.max(alongX?bs.z:bs.x,0.8);
  const r=shortLen/2+0.3;
  const n=Math.min(8,Math.max(1,Math.ceil(longLen/(r*1.4))));
  for(let k=0;k<n;k++){
    const t=n===1?0:(k/(n-1)-.5)*(longLen-2*(shortLen/2));
    const o={x:bc.x+(alongX?t:0),z:bc.z+(alongX?0:t),r};
    importedObstacles.push(o);obstacles.push(o);
  }
}

glbInput.addEventListener('change',()=>{
  const file=glbInput.files?.[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  gltfLoader.load(url,gltf=>{
    URL.revokeObjectURL(url);
    placeImportedModel(gltf.scene);
    glbInput.value='';
  },undefined,err=>{
    URL.revokeObjectURL(url);
    console.error(err);
    alert('GLB 파일을 불러오지 못했습니다. 단일 .glb 파일인지 확인해 주세요.');
    glbInput.value='';
  });
});

// 충돌용 단순 원형 장애물: 집 + 나무
const obstacles=[{x:-12,z:-7,r:7.3},[-27,-20,2],[-23,17,1.8],[17,-20,2.1],[25,-5,1.6],[20,20,2],[-29,30,1.8],[31,29,2]].map(o=>Array.isArray(o)?{x:o[0],z:o[1],r:o[2]}:o);
function canMove(x,z){if(Math.abs(x)>42||Math.abs(z)>42)return false;return !obstacles.some(o=>Math.hypot(x-o.x,z-o.z)<o.r);}

const keys={};addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='f'&&!e.repeat){e.preventDefault();for(const kk in keys)keys[kk]=false;glbInput.click();return;}if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
[['up','w'],['down','s'],['left','a'],['right','d']].forEach(([id,k])=>{const b=document.getElementById(id);const on=e=>{e.preventDefault();keys[k]=true};const off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});

const clock=new THREE.Clock();let walk=0;
const camTarget=new THREE.Vector3(),desiredCam=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);let x=0,z=0;
 if(keys.w||keys.arrowup)z-=1;if(keys.s||keys.arrowdown)z+=1;if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;
 const moving=x||z;if(moving){const len=Math.hypot(x,z);x/=len;z/=len;const speed=6.2;const nx=player.position.x+x*speed*dt,nz=player.position.z+z*speed*dt;if(canMove(nx,player.position.z))player.position.x=nx;if(canMove(player.position.x,nz))player.position.z=nz;const targetRot=Math.atan2(x,z);let diff=((targetRot-player.rotation.y+Math.PI)%(Math.PI*2))-Math.PI;player.rotation.y+=diff*Math.min(1,dt*12);walk+=dt*10;armL.rotation.x=Math.sin(walk)*.65;armR.rotation.x=-Math.sin(walk)*.65;legL.rotation.x=-Math.sin(walk)*.55;legR.rotation.x=Math.sin(walk)*.55;}else{armL.rotation.x*=.8;armR.rotation.x*=.8;legL.rotation.x*=.8;legR.rotation.x*=.8;}
 // 카메라는 캐릭터 진행방향 뒤쪽에서 부드럽게 추적
 const back=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));desiredCam.copy(player.position).addScaledVector(back,-8.5);desiredCam.y=6.5;camera.position.lerp(desiredCam,1-Math.pow(.001,dt));camTarget.copy(player.position);camTarget.y=2.2;camera.lookAt(camTarget);
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
